# TrueFoundry AI Gateway: keep a runaway agent loop from hammering the model.
# Apply with `tfy apply -f truefoundry/rate-limit.yaml` or paste into AI Gateway → Config → Rate Limiting.
name: show-dont-tell-ratelimit
type: gateway-rate-limiting-config
rules:
  - id: agent-loop-rpm
    when:
      models: ['openai-main/gpt-5.6-sol']
    limit_to: 60
    unit: requests_per_minute
  - id: vision-rpm
    when:
      models: ['openai-polaris/gpt-4o']
    limit_to: 20
    unit: requests_per_minute
