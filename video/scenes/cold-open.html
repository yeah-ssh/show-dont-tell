<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  .line { font-size: 64px; font-weight: 500; letter-spacing: -0.02em; color: #e8e8ee; }
  .line span { display: inline-block; opacity: 0; }
</style></head>
<body>
  <div class="glow violet" style="width:900px;height:900px;left:510px;top:90px;opacity:0"></div>
  <div class="stage"><div class="content"><div class="line" id="l"></div></div></div>
  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script src="lib.js"></script>
  <script>
    const text = 'Every support team knows this sentence.';
    document.getElementById('l').innerHTML = text.split(' ').map(w => `<span>${w}&nbsp;</span>`).join('');
    window.build = D => {
      const tl = gsap.timeline({ paused: true });
      tl.to('.glow', { opacity: 0.35, duration: 2.5, ease: 'sine.out' }, 0.2);
      drift(tl, D);
      tl.fromTo('#l span', { opacity: 0, y: 24, filter: 'blur(8px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, stagger: 0.12, ease: 'power3.out' }, 0.4);
      outro(tl, D, 0.7);
      return tl;
    };
  </script>
</body></html>
