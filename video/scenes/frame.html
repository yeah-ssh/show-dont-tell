<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  /* Backdrop for framed footage: gradient + window shadow + a product chip.
     mode=mask renders a white rounded rectangle on black (the window's alpha mask). */
  .win { position: absolute; left: 120px; top: 90px; width: 1680px; height: 945px; border-radius: 22px; }
  .shadow { box-shadow: 0 50px 120px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08); background: #0b0c10; }
  .chip {
    position: absolute; left: 120px; top: 26px; display: inline-flex; align-items: center; gap: 12px;
    font-size: 26px; font-weight: 600; color: #e7e7ee; letter-spacing: 0.01em;
  }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #7c6cff, #2dd4bf); }
  body.mask { background: #000; }
  body.mask .win { background: #fff; }
</style></head>
<body>
  <script src="lib.js"></script>
  <script>
    if (params.mode === 'mask') {
      document.body.className = 'mask';
      document.body.innerHTML = '<div class="win"></div>';
    } else {
      document.body.innerHTML =
        '<div class="glow violet" style="width:1100px;height:900px;left:-200px;top:-150px;opacity:.35"></div>' +
        '<div class="glow teal" style="width:900px;height:800px;left:1250px;top:500px;opacity:.22"></div>' +
        '<div class="win shadow"></div>' +
        (params.chip ? `<div class="chip"><span class="dot"></span>${params.chip}</div>` : '');
    }
  </script>
</body></html>
