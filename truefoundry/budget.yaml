# TrueFoundry AI Gateway: daily spend cap for the Show-Don't-Tell agent.
# Apply with `tfy apply -f truefoundry/budget.yaml` or paste into AI Gateway → Config → Budget Limiting.
# The free Developer plan includes one budget rule.
name: show-dont-tell-budget
type: gateway-budget-config
rules:
  - id: show-dont-tell-daily
    when:
      models:
        - openai-polaris/gpt-4o      # vision double-check (browser-lab) via the gateway
        - openai-main/gpt-5.6-sol    # agent loop, when TFY_AGENT_MODEL routes it through the gateway
    limit_to: 5
    unit: cost_per_day
    budget_applies_per: ['model']
    audit_mode: false
    alerts:
      thresholds: [75, 90, 100]
