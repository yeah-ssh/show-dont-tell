<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  /* On-screen label for real footage: explains what the viewer is looking at. Top-right of the window. */
  html, body { background: transparent; }
  .note {
    position: absolute; right: 150px; top: 118px; display: inline-flex; align-items: center; gap: 16px;
    padding: 16px 26px; border-radius: 18px; max-width: 1100px;
    background: rgba(12, 12, 18, 0.9); border: 1.5px solid var(--c); box-shadow: 0 18px 50px rgba(0,0,0,.55);
    font-size: 34px; font-weight: 700; letter-spacing: -0.01em; color: #fff;
  }
  .note .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); flex: none; }
</style></head>
<body>
  <div class="note" id="n"><span class="dot"></span><span id="t"></span></div>
  <script src="lib.js"></script>
  <script>
    const colors = { info: '#8b7dff', warn: '#ffb454', good: '#22c55e' };
    document.getElementById('n').style.setProperty('--c', colors[params.tone] || colors.info);
    document.getElementById('t').textContent = params.text || '';
  </script>
</body></html>
